# Persist queued task history across service restarts.
bind 127.0.0.1
port 6379

save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir ./redis_data
rdbcompression yes
rdbchecksum yes

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

loglevel notice
logfile "redis.log"

# Set an explicit limit when this instance shares a host with other services.
# maxmemory 2gb
maxmemory-policy allkeys-lru
databases 16

# Keep this service bound to loopback when changing protection settings.
protected-mode yes
daemonize no
timeout 0
tcp-keepalive 300
slowlog-log-slower-than 10000
slowlog-max-len 128
